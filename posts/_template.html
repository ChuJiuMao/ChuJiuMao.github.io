<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章标题 · ChuJiuMao's Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<!-- MathJax (如需数学公式) -->
<!--
<script>window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']],tags:'ams'},svg:{fontCache:'global'}};</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
-->
<link rel="stylesheet" href="../assets/css/global.css">
<link rel="stylesheet" href="../assets/css/article.css">
<!--
  ⚠️ 重要：禁止在此文件中嵌入布局相关的 <style> 块（如 .page-wrapper、.paper-main、.toc-sidebar 等）。
  所有文章外壳由 assets/js/article-shell.js 统一生成。
  文章文件只保留 paper-main 内的标题、元信息和正文内容。
  所有布局和响应式样式都在 assets/css/article.css 中统一管理。
-->
</head>
<body>
<main class="paper-main" id="paperMain">
    <header class="paper-header">
      <span class="article-type">Article</span>
      <h1>文章标题</h1>
      <div class="authors">作者列表</div>
      <div class="meta-line">期刊信息 · 年份</div>
      <a class="doi-link" href="#" target="_blank">DOI: 10.xxxx/xxxxx</a>
    </header>

    <div class="paper-body">
      <!--
        文章正文在此。
        每个一级章节使用 <section id="section-id">
        每个 section 内使用 h2/h3 次级标题。
        图片使用 .figure 结构。
        表格使用 .table-wrap 结构。
        数学公式使用 MathJax 语法。
        参考文献使用 .references-section。
      -->

      <section id="abstract">
        <h2>摘要</h2>
        <p>此处填写摘要内容。</p>
      </section>

      <section id="introduction">
        <h2>引言</h2>
        <p>正文内容...</p>

        <div class="figure">
          <img src="../figures/fig1.jpg" alt="图1说明">
          <figcaption><span class="fig-label">Fig. 1</span> 图注说明</figcaption>
        </div>
      </section>

      <!-- 更多章节... -->

      <section id="references">
        <h2>参考文献</h2>
        <div class="references-section">
          <ol>
            <li id="ref1">作者. 标题. <em>期刊</em>, 年份, 卷(期): 页码.</li>
            <!-- 更多参考文献 -->
          </ol>
        </div>
      </section>
    </div>
  </main>

<script src="../assets/js/article-shell.js"></script>
<script src="../assets/js/theme.js"></script>
</body>
</html>
