<!DOCTYPE html>
<html lang="zh-CN" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 · ChuJiuMao's Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/global.css">
<style>
.page-title {
  max-width: 720px;
  margin: 0 auto;
  padding: 2.5rem 2rem 0;
  font-family: var(--heading-font);
  font-size: 1.6rem;
  font-weight: 700;
}
.page-title span { color: var(--theme-color); }

.about-wrap {
  max-width: 720px;
  margin: 0 auto;
  padding: 2rem 2rem 4rem;
}

.about-card {
  background: var(--surface);
  border: 1px solid var(--hl-med);
  border-radius: 8px;
  padding: 2rem;
  margin-bottom: 2rem;
}

.about-card h2 {
  font-family: var(--heading-font);
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 1rem;
  color: var(--text-color);
}

.about-card p {
  font-size: 0.95rem;
  line-height: 1.8;
  color: var(--text-color);
  margin-bottom: 0.8rem;
}
.about-card p:last-child { margin-bottom: 0; }

.about-card .placeholder {
  color: var(--muted);
  font-style: italic;
}

.about-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.8rem;
  margin-top: 1rem;
}
.about-links a {
  display: inline-flex;
  align-items: center;
  gap: 0.4em;
  font-family: var(--heading-font);
  font-size: 0.9rem;
  padding: 0.5rem 1.2rem;
  border-radius: 6px;
  border: 1px solid var(--hl-med);
  background: var(--surface);
  color: var(--subtle);
  text-decoration: none;
  transition: all 0.2s;
}
.about-links a:hover {
  color: var(--theme-color);
  border-color: var(--theme-color);
  background: var(--hl-low);
}

@media (max-width: 640px) {
  .page-title { padding: 2rem 1.5rem 0; }
  .about-wrap { padding: 1.5rem 1.5rem 3rem; }
  .about-card { padding: 1.5rem; }
}
</style>
</head>
<body>

<nav class="nav-bar">
  <div class="nav-inner">
    <a href="/" class="logo"><span>C</span>huJiuMao</a>
    <div class="nav-links" id="navLinks">

      <a href="https://github.com/ChuJiuMao" target="_blank">GitHub</a>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle" aria-label="切换主题"></button>
      <button class="nav-menu-btn" id="navMenuBtn" aria-label="菜单">☰</button>
    </div>
  </div>
</nav>

<div class="page-container">
  <h1 class="page-title">关于<span>本站</span></h1>

  <div class="about-wrap">

    <div class="about-card">
      <h2>👤 ChuJiuMao</h2>
      <p class="placeholder">这里填你的个人介绍——研究方向、兴趣爱好、职业背景等。</p>
      <p class="placeholder">示例：某方向博士生/研究员，关注 XXX 领域。业余时间喜欢阅读和写作。</p>
    </div>

    <div class="about-card">
      <h2>📖 关于这个博客</h2>
      <p>本博客使用纯静态 HTML 构建，灵感来自 <a href="https://github.com/Orange-way/hexo-theme-orange" target="_blank">hexo-theme-orange</a> 的主题设计，配色方案为 <a href="https://rosepinetheme.com" target="_blank">Rosé Pine</a>。</p>
      <p>主要内容为学术论文的翻译与解读（归类为 <strong>Article</strong>），以及日常阅读随想。</p>
    </div>

    <div class="about-card">
      <h2>🔗 联系方式</h2>

        <a href="https://github.com/ChuJiuMao" target="_blank">GitHub</a>

    </div>

  </div>
</div>

<footer class="footer">

</footer>

<script src="assets/js/theme.js"></script>
</body>
</html>
